services:
  - type: web
    name: n8n-from-scratch
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /app/data/workflows.db
      - key: KEY_PATH
        value: /app/data/.encryption-key
      - key: ENCRYPTION_KEY
        generateValue: true
      # When present, the app uses Postgres instead of the ephemeral SQLite file.
      - key: DATABASE_URL
        fromService:
          type: postgres
          name: n8n-db
          property: connectionString

databases:
  - name: n8n-db
    plan: free
