services:
  - type: web
    name: n8n-from-scratch
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /app/data/workflows.db
      - key: KEY_PATH
        value: /app/data/.encryption-key
      - key: ENCRYPTION_KEY
        generateValue: true
